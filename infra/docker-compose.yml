services:
  # ── PostgreSQL (required by Evolution API v2.x) ──
  postgres:
    image: postgres:15-alpine
    container_name: ar-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:-evolution2026}
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ar-net

  # ── Evolution API (WhatsApp Gateway) ──
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: ar-evolution
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution2026}@ar-postgres:5432/evolution
      - REDIS_ENABLED=true
      - REDIS_URI=redis://ar-redis:6379
      - LANGUAGE=pt-BR
    volumes:
      - evolution_data:/evolution/store
    networks:
      - ar-net
    depends_on:
      - postgres
      - redis

  # ── Redis (BullMQ) ──
  redis:
    image: redis:7-alpine
    container_name: ar-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - ar-net

  # ── Audio Service (faster-whisper + librosa) ──
  audio-svc:
    build:
      context: ../apps/audio-svc
      dockerfile: Dockerfile
    container_name: ar-audio-svc
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - AUDIO_ALLOWED_HOSTS=${AUDIO_ALLOWED_HOSTS:-dwqdpumeehcamnrbddad.supabase.co,evolution.193-203-182-39.sslip.io}
      - AUDIO_MAX_BYTES=${AUDIO_MAX_BYTES:-536870912}
    volumes:
      - audio_data:/tmp/audio
    networks:
      - ar-net

  # Persistent presentation queue consumer.
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: ar-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-3002}:3001"
    environment:
      - WORKER_PORT=3001
      - REDIS_URL=redis://ar-redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_SONNET_MODEL=${CLAUDE_SONNET_MODEL:-claude-sonnet-4-6}
      - AUDIO_SERVICE_URL=http://audio-svc:8000
    networks:
      - ar-net
    depends_on:
      redis:
        condition: service_started
      audio-svc:
        condition: service_healthy

  # ── Caddy (reverse proxy + TLS) ──
  caddy:
    image: caddy:2-alpine
    container_name: ar-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ar-net

volumes:
  evolution_data:
  redis_data:
  audio_data:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  ar-net:
    driver: bridge
